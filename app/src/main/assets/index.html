<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IUDigital Stereo</title>
    <link rel="stylesheet" href="css/bootstrap-material-design.min.css">
</head>
<body class="bg-light text-center p-3">

<header class="mb-4">
    <img src="img/logo.png" alt="Logo IUDigital" class="img-fluid my-2" style="max-height: 80px;">
    <h2 class="h4 text-primary font-weight-bold">IUDigital Stereo</h2>
</header>

<main class="container my-4">
    <div class="card shadow-sm p-3 mb-3 bg-white rounded">
        <div class="card-body">
            <img src="img/air.gif" alt="On Air" class="img-fluid rounded mb-3" id="radioGif">
            <h5 class="card-title">Sintonía en Vivo</h5>
            <p class="card-text text-muted">Bienvenido a tu emisora favorita, escucha la mejor música y noticias sobre nuestra Alma Mater Virtual.</p>

            <div class="mt-4">
                <button type="button" id="play" class="btn btn-outline-primary mx-1">PLAY</button>
                <button type="button" id="pausa" class="btn btn-outline-primary mx-1">PAUSE</button>
            </div>
            <div class="mt-3">
                <button type="button" id="volumemas" class="btn btn-outline-secondary mx-1">Vol +</button>
                <button type="button" id="volumemenos" class="btn btn-outline-secondary mx-1">Vol -</button>
            </div>

            <audio id="emisora">
                <source src="http://174.142.111.104:9974/;" type="audio/mpeg" />
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>
    </div>
</main>

<script src="js/jquery-3.2.1.slim.min.js"></script>
<script src="js/popper.js"></script>
<script src="js/bootstrap-material-design.min.js"></script>
<script src="js/gestures.js"></script>
</body>
</html>
